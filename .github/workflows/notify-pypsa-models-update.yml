name: Notify PyPSA Models Update

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write  # required to push the library version tag

jobs:
  notify:
    name: Check PyPSA models version and notify air-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read current PyPSA models version
        id: current
        run: |
          VERSION=$(jq -r '.pypsa_models_version' dependencies.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current pypsa_models_version: $VERSION"

      - name: Read previous PyPSA models version from last library tag
        id: previous
        run: |
          LAST_TAG=$(git tag --list 'pypsa_models-v*' --sort=-creatordate | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "No previous library tag found."
            echo "version=none" >> "$GITHUB_OUTPUT"
          else
            echo "Last library tag: $LAST_TAG"
            PREV_VERSION=$(git show "${LAST_TAG}:dependencies.json" 2>/dev/null \
              | jq -r '.pypsa_models_version // "none"')
            echo "version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
            echo "Previous pypsa_models_version at ${LAST_TAG}: $PREV_VERSION"
          fi

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          PREVIOUS="${{ steps.previous.outputs.version }}"
          echo "Current: $CURRENT  |  Previous: $PREVIOUS"
          if [ "$CURRENT" = "$PREVIOUS" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Version unchanged — no notification needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Version changed from $PREVIOUS to $CURRENT — will tag and notify."
          fi

      - name: Create library version tag
        if: steps.compare.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          TAG="pypsa_models-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Created and pushed tag: $TAG"

      - name: Create issue in air-quality repo
        if: steps.compare.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.AIR_QUALITY_REPO_PAT }}
          script: |
            const current  = '${{ steps.current.outputs.version }}';
            const previous = '${{ steps.previous.outputs.version }}';
            const title = `PyPSA models updated to v${current} in GEMSAPP`;

            const existing = await github.rest.issues.listForRepo({
              owner: 'nikolaredstork',
              repo: 'air-quality',
              state: 'open',
            });

            const duplicate = existing.data.find(i =>
              i.title.includes(`PyPSA models updated to v${current}`)
            );
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} - skipping.`);
              return;
            }

            const sourceUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            const body = [
              `PyPSA models library updated to \`v${current}\` in [GEMSAPP](${sourceUrl}).`,
              '',
              `Changelog: ${sourceUrl}/blob/master/resources/pypsa_models/CHANGELOG-pypsa_models_library.md`,
              '',
              'Update `libraries/pypsa_models.yml` in air-quality accordingly.',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: 'nikolaredstork',
              repo: 'air-quality',
              title: title,
              body: body,
            });

            console.log(`Issue created: #${result.data.number} - ${result.data.html_url}`);
