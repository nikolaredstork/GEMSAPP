name: Notify PyPSA Models Update

on:
  push:
    branches:
      - master
    paths:
      - 'libraries/pypsa_models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    name: Check PyPSA models version and notify air-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read current version and air-quality library version
        id: version
        env:
          GH_TOKEN: ${{ secrets.AIR_QUALITY_REPO_PAT }}
        run: |
          CURR=$(python3 -c "import yaml; print(yaml.safe_load(open('libraries/pypsa_models.yml'))['library']['version'])")
          echo "version=$CURR" >> "$GITHUB_OUTPUT"

          # Read the version currently in the air-quality repo (empty string if file absent or API unavailable)
          AIR_VERSION=$(gh api "repos/nikolaredstork/air-quality/contents/libraries/pypsa_models.yml" \
            --jq '.content' 2>/dev/null \
            | base64 -d 2>/dev/null \
            | python3 -c "import yaml,sys; print(yaml.safe_load(sys.stdin).get('library', {}).get('version', ''))" \
            2>/dev/null || echo "")

          echo "Current: $CURR  |  air-quality: $AIR_VERSION"
          if [ "$CURR" = "$AIR_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue in air-quality repo
        if: steps.version.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.AIR_QUALITY_REPO_PAT }}
          script: |
            const version   = '${{ steps.version.outputs.version }}';
            const sourceUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const title     = `PyPSA models updated to v${version} in GEMSAPP`;

            const existing = await github.rest.issues.listForRepo({
              owner: 'nikolaredstork',
              repo: 'air-quality',
              state: 'open',
            });

            const duplicate = existing.data.find(i => i.title.includes(`v${version}`));
            if (duplicate) {
              console.log(`Issue already exists: #${duplicate.number} — skipping.`);
              return;
            }

            const body = [
              `PyPSA models library updated to \`v${version}\` in [GEMSAPP](${sourceUrl}).`,
              '',
              'Update `libraries/pypsa_models.yml` in air-quality accordingly.',
            ].join('\n');

            const result = await github.rest.issues.create({
              owner: 'nikolaredstork',
              repo: 'air-quality',
              title: title,
              body: body,
            });

            console.log(`Issue created: #${result.data.number} — ${result.data.html_url}`);
