[project]
name = "gemsapp"
version = "0.1.0"
description = "Web application for editing and simulating GEMS power system studies."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0,<4",
    "flask-socketio>=5.3,<6",
    "pyyaml>=6.0,<7",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app"]
